name: lab-ci

on:
  push:
    paths: ["lab/**", ".github/workflows/lab-ci.yml"]
  pull_request:
    paths: ["lab/**", ".github/workflows/lab-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: lab

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m "not integration" --cov=everkeep_lab --cov-report=term-missing

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e ".[dev]"
      - run: pytest -m integration -rs
