name: core-ci

on:
  push:
    paths: ["core/**", ".github/workflows/core-ci.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/core-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path core
