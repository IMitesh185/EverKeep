name: Spike
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Spike:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sidequest.spike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Feasibility spike
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  SpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SpikeTests]
    dependencies:
      - target: Spike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sidequest.spike.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Spike:
    build:
      targets:
        Spike: all
    test:
      targets: [SpikeTests]
